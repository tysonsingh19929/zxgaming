<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AllPanel777 Sportsbook Exchange & Real-Time Live Odds</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ap-app">
    <!-- 1. Header Bar -->
    <header class="ap-header">
      <div class="ap-brand">
        <button class="ap-mobile-toggle" id="mobile-toggle-btn">
          <i class="fa-solid fa-list-ul"></i> Matches
        </button>
        <div class="ap-logo">ALLPANEL<span>777</span></div>
      </div>

      <div class="ap-header-right">
        <div class="ap-stream-status" id="stream-status">
          <span class="ap-dot"></span> STREAM LIVE
        </div>
        <div class="ap-balance-badge">
          <span>Pts: <strong>0.00</strong></span>
        </div>
      </div>
    </header>

    <!-- 2. Top Sports Navigation Bar -->
    <nav class="ap-nav-bar">
      <button class="ap-nav-item active" data-sport="all"><i class="fa-solid fa-fire"></i> In-Play / All</button>
      <button class="ap-nav-item" data-sport="cricket"><i class="fa-solid fa-baseball-bat-ball"></i> Cricket</button>
      <button class="ap-nav-item" data-sport="soccer"><i class="fa-solid fa-futbol"></i> Soccer</button>
      <button class="ap-nav-item" data-sport="tennis"><i class="fa-solid fa-baseball"></i> Tennis</button>
    </nav>

    <!-- 3. Main Grid Layout -->
    <div class="ap-main-grid">
      <!-- Left Sidebar (Mobile Drawer) -->
      <aside class="ap-sidebar" id="sidebar-drawer">
        <div class="ap-sidebar-header">
          <span><i class="fa-solid fa-list"></i> Select Match</span>
          <span id="events-count" style="color:#fff;">0 Active</span>
        </div>
        <div class="ap-events-list" id="events-list">
          <div style="text-align:center; padding:2rem; color:var(--ap-text-muted);">
            <i class="fa-solid fa-circle-notch fa-spin"></i> Loading matches...
          </div>
        </div>
      </aside>

      <!-- Center Stage View -->
      <main class="ap-stage">
        <!-- Match Banner -->
        <div class="ap-event-banner" id="event-banner">
          <div class="ap-banner-title">Select a Match from the List</div>
          <div class="ap-banner-info">Tap "Matches" button or pick Cricket, Soccer, or Tennis from the top menu.</div>
        </div>



        <!-- Markets Container -->
        <div id="markets-container">
          <div class="ap-empty-state">
            <i class="fa-solid fa-chart-line" style="font-size:2.5rem; margin-bottom:0.75rem; color:var(--ap-gold);"></i>
            <h3>Select a Live Match to View Odds</h3>
            <p>Match Odds, Bookmaker rates, Fancy Bets, and Sportsbook lines will render here.</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
